<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Taxi Brousse - Accueil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .menu-item {
            padding: 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .menu-item:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚕 Bienvenue - Taxi Brousse</h1>
        <p style="text-align: center; color: #666;">Système de gestion des réservations de taxi</p>
        
        <div class="menu">
            <a th:href="@{/clients}" class="menu-item">Clients</a>
            <a th:href="@{/voyages}" class="menu-item">Voyages</a>
            <a th:href="@{/voitures}" class="menu-item">Voitures</a>
            <a th:href="@{/employes}" class="menu-item">Employés</a>
            <a th:href="@{/reservations}" class="menu-item">Réservations</a>
            <a th:href="@{/paiements}" class="menu-item">Paiements</a>
            <a th:href="@{/entretients}" class="menu-item">Entretiens</a>
            <a th:href="@{/parametres}" class="menu-item">Paramètres</a>
        </div>
    </div>
</body>
</html>
