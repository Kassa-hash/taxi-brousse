<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Valeur Maximale</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-6">
<div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full">
  <div class="text-center mb-8">
    <h1 class="text-xl text-slate-400 uppercase tracking-widest font-semibold">Analyse de Rentabilité</h1>
    <p class="text-3xl font-bold text-white mt-2">Revenu Max Potentiel</p>
  </div>

  <div class="space-y-6">
    <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl">
      <span>Voiture assignée :</span>
      <span class="font-bold text-blue-400" th:text="'ID #' + ${voyage.voiture.idVoiture}"></span>
    </div>

    <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl">
      <span>Capacité totale :</span>
      <span class="font-bold text-blue-400" th:text="${voyage.voiture.capacite} + ' places'"></span>
    </div>

    <div class="pt-6 border-t border-slate-700 text-center">
      <p class="text-sm text-slate-500 mb-1">Valeur totale générable</p>
      <div class="text-5xl font-black text-green-500 tracking-tight">
        <span th:text="${#numbers.formatDecimal(valeurMax, 0, 'WHITESPACE', 0, 'POINT')}"></span>
        <span class="text-2xl">Ar</span>
      </div>
    </div>
  </div>

  <button onclick="window.print()" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-900/20">
    Imprimer le rapport
  </button>
</div>
</body>
</html>
