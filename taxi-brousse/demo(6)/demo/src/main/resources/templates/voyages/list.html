<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voyages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        a.btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 3px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-edit {
            background-color: #ffc107;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 3px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Gestion des Voyages</h1>

    <a th:href="@{/voyages/new}" class="btn">+ Nouveau Voyage</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Date départ</th>
            <th>Heure départ</th>
            <th>Gare départ</th>
            <th>Gare arrivée</th>
            <th>Places dispo</th>
            <th>Prix</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="voyage : ${voyages}">
            <td th:text="${voyage.idVoyage}"></td>
            <td th:text="${voyage.datedepart}"></td>
            <td th:text="${voyage.heuredepart}"></td>

            <!-- À adapter selon les champs de GareRoutiere -->
            <td th:text="${voyage.gareDepart.nom}"></td>
            <td th:text="${voyage.gareArrivee.nom}"></td>

            <td th:text="${voyage.nbPlaceDisponible}"></td>
            <td th:text="${voyage.prix} + ' Ar'"></td>

            <td class="actions">
                <a th:href="@{/voyages/{id}(id=${voyage.idVoyage})}" class="btn-edit">Voir</a>
                <a th:href="@{/voyages/{id}/edit(id=${voyage.idVoyage})}" class="btn-edit">Éditer</a>
                <a th:href="@{/voyages/{id}/delete(id=${voyage.idVoyage})}"
                   class="btn-delete"
                   onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="back">Retour à l'accueil</a>

</div>
</body>
</html>
