<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Employé</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        form { margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
        .btn { padding: 10px 20px; text-decoration: none; border-radius: 3px; margin-right: 10px; border: none; cursor: pointer; font-size: 14px; }
        .btn-submit { background-color: #28a745; color: white; }
        .back { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${employe.id != null} ? 'Éditer Employé' : 'Créer Employé'"></h1>
        
        <form th:action="${employe.id != null} ? @{/employes/{id}/update(id=${employe.id})} : @{/employes/create}" method="POST">
            <div class="form-group">
                <label for="nom">Nom:</label>
                <input type="text" id="nom" name="nom" th:value="${employe.nom}" required>
            </div>
            
            <div class="form-group">
                <label for="datenaissance">Date Naissance:</label>
                <input type="date" id="datenaissance" name="datenaissance" th:value="${employe.datenaissance}" required>
            </div>
            
            <div class="form-group">
                <label for="dateembauche">Date Embauche:</label>
                <input type="date" id="dateembauche" name="dateembauche" th:value="${employe.dateembauche}" required>
            </div>
            
            <div class="form-group">
                <label for="genreId">Genre:</label>
                <select id="genreId" name="genreId" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="g : ${genres}" th:value="${g.idGenre}" th:selected="${employe.genre?.idGenre == g.idGenre}" th:text="${g.libelleGenre}"></option>
                </select>
            </div>
            
            <div>
                <button type="submit" class="btn btn-submit">Enregistrer</button>
                <a th:href="@{/employes}" class="btn back">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
