<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employés</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        a.btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 3px;
            margin-bottom: 20px;
        }
        a.btn:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn-edit, .btn-delete {
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
            font-size: 12px;
        }
        .btn-edit {
            background-color: #ffc107;
            color: white;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        a.back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des Employés</h1>
        <a th:href="@{/employes/new}" class="btn">+ Nouvel Employé</a>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Date Naissance</th>
                    <th>Date Embauche</th>
                    <th>Genre</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employe : ${employes}">
                    <td th:text="${employe.id}"></td>
                    <td th:text="${employe.nom}"></td>
                    <td th:text="${employe.datenaissance}"></td>
                    <td th:text="${employe.dateembauche}"></td>
                    <td th:text="${employe.genre.libelleGenre}"></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/employes/{id}(id=${employe.id})}" class="btn-edit">Voir</a>
                            <a th:href="@{/employes/{id}/edit(id=${employe.id})}" class="btn-edit">Éditer</a>
                            <a th:href="@{/employes/{id}/delete(id=${employe.id})}" class="btn-delete" onclick="return confirm('Êtes-vous sûr?')">Supprimer</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <a th:href="@{/}" class="back">Retour à l'accueil</a>
    </div>
</body>
</html>
