<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Paramètre</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        form { margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
        .btn { padding: 10px 20px; text-decoration: none; border-radius: 3px; margin-right: 10px; border: none; cursor: pointer; font-size: 14px; }
        .btn-submit { background-color: #28a745; color: white; }
        .back { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${parametre.idParametre != null} ? 'Éditer Paramètre' : 'Créer Paramètre'"></h1>
        
        <form th:action="${parametre.idParametre != null} ? @{/parametres/{id}/update(id=${parametre.idParametre})} : @{/parametres/create}" method="POST">
            <div class="form-group">
                <label for="cleParametre">Clé:</label>
                <input type="text" id="cleParametre" name="cleParametre" th:value="${parametre.cleParametre}" required>
            </div>
            
            <div class="form-group">
                <label for="valeurParametre">Valeur:</label>
                <input type="text" id="valeurParametre" name="valeurParametre" th:value="${parametre.valeurParametre}" required>
            </div>
            
            <div>
                <button type="submit" class="btn btn-submit">Enregistrer</button>
                <a th:href="@{/parametres}" class="btn back">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
