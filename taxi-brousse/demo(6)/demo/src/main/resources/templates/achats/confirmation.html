<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation d'Achat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e5e7eb;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            max-width: 700px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 {
            color: #f8fafc;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }
        .section-title {
            color: #38bdf8;
            font-size: 17px;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .info-box {
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            font-weight: 600;
            color: #f8fafc;
        }
        .detail-value {
            color: #cbd5f5;
        }
        .summary-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        .total-section {
            background: #0f172a;
            color: #38bdf8;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            border: 1px solid #334155;
        }
        .total-label {
            font-size: 14px;
            margin-bottom: 10px;
            color: #cbd5f5;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .total-amount {
            font-size: 32px;
            font-weight: 700;
            color: #38bdf8;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        button, a {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .btn-primary:hover {
            background-color: #0ea5e9;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3);
        }
        .btn-secondary {
            background-color: #334155;
            color: #e5e7eb;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            border-left: 4px solid;
        }
        .alert-warning {
            background-color: #7c2d12;
            color: #fed7aa;
            border-left-color: #ea580c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ Confirmation d'Achat</h1>

        <div th:if="${error}" class="alert alert-warning">
            <strong>Attention!</strong> <span th:text="${error}"></span>
        </div>

        

       

        <div class="section-title">Détails du Voyage</div>
        <div class="summary-box">
            <div class="detail-row">
                <span class="detail-label">Trajet:</span>
                <span class="detail-value" th:text="${voyage.gareDepart.nom + ' → ' + voyage.gareArrivee.nom}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Date:</span>
                <span class="detail-value" th:text="${#temporals.format(voyage.datedepart, 'dd/MM/yyyy')}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Heure:</span>
                <span class="detail-value" th:text="${#temporals.format(voyage.heuredepart, 'HH:mm')}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Nombre de places:</span>
                <span class="detail-value" th:text="${nbPlaces}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Prix par place:</span>
                <span class="detail-value" th:text="${voyage.prix + ' $'}"></span>
            </div>
        </div>

        <div class="total-section">
            <div class="total-label">Montant Total</div>
            <div class="total-amount" th:text="${voyage.prix * nbPlaces + ' $'}"></div>
        </div>

        <form th:action="@{/achats/payer}" method="post">
            <input type="hidden" name="idVoyage" th:value="${voyage.idVoyage}">
            <input type="hidden" name="nbPlaces" th:value="${nbPlaces}">
            <input type="hidden" name="nomClient" th:value="${nomClient}">
            <input type="hidden" name="emailClient" th:value="${emailClient}">
            <input type="hidden" name="telephoneClient" th:value="${telephoneClient}">
            <input type="hidden" name="montant" th:value="${voyage.prix * nbPlaces}">

            <div class="button-group">
                <button type="submit" class="btn-primary">💳 Payer Maintenant</button>
                <a href="/achats/recherche" class="btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
