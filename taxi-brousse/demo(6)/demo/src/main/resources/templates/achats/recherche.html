<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Acheter un Ticket</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #e5e7eb;
      }
      .container {
        background-color: #1e293b;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        max-width: 600px;
        width: 100%;
        border: 1px solid #334155;
      }
      h1 {
        color: #f8fafc;
        margin-bottom: 30px;
        text-align: center;
        font-weight: 600;
      }
      .alert {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 6px;
        border-left: 4px solid;
      }
      .alert-danger {
        background-color: #7f1d1d;
        color: #fecaca;
        border-left-color: #dc2626;
      }
      .alert-warning {
        background-color: #7c2d12;
        color: #fed7aa;
        border-left-color: #ea580c;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #e5e7eb;
        font-weight: 600;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #334155;
        border-radius: 6px;
        font-size: 14px;
        background-color: #0f172a;
        color: #f8fafc;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      select:focus,
      input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }
      button {
        flex: 1;
        padding: 13px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .btn-primary {
        background-color: #38bdf8;
        color: #0f172a;
      }
      .btn-primary:hover {
        background-color: #0ea5e9;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3);
      }
      .btn-secondary {
        background-color: #334155;
        color: #e5e7eb;
      }
      .btn-secondary:hover {
        background-color: #475569;
      }
      .info-box {
        background-color: #0f172a;
        border-left: 4px solid #38bdf8;
        padding: 15px;
        margin-top: 20px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚌 Acheter un Ticket de Transport</h1>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form th:action="@{/achats/search-voyage}" method="post">
        <div class="form-group">
          <label for="gareDepart">Gare de Départ *</label>
          <select id="gareDepart" name="idGareDepart" required>
            <option value="">-- Sélectionner une gare --</option>
            <option
              th:each="gare : ${gares}"
              th:value="${gare.idGareRoutiere}"
              th:text="${gare.nom}"
            ></option>
          </select>
        </div>

        <div class="form-group">
          <label for="gareArrivee">Gare d'Arrivée *</label>
          <select id="gareArrivee" name="idGareArrivee" required>
            <option value="">-- Sélectionner une gare --</option>
            <option
              th:each="gare : ${gares}"
              th:value="${gare.idGareRoutiere}"
              th:text="${gare.nom}"
            ></option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dateVoyage">Date du Voyage *</label>
            <input type="date" id="dateVoyage" name="datedepart" required />
          </div>
          <div class="form-group">
            <label for="heureVoyage">Heure du Voyage *</label>
            <input type="time" id="heureVoyage" name="heuredepart" required />
          </div>
        </div>

        <div class="form-group">
          <label for="nbPlaces">Nombre de Places *</label>
          <input
            type="number"
            id="nbPlaces"
            name="nbPlaces"
            min="1"
            max="50"
            required
            value="1"
          />
        </div>

       <div class="form-group">
    <label for="categorie">Catégorie de Place *</label>
    <select id="categorie" name="idCategorie" required>
        <option value="">-- Choisir une catégorie --</option>
        <option th:each="cat : ${categories}" 
                th:value="${cat.idCatPlace}" 
                th:text="${cat.libelle}">
        </option>
    </select>
</div>

        <div class="button-group">
          <button type="submit" class="btn-primary">
            Continuer vers le Formulaire Client
          </button>
          <button type="reset" class="btn-secondary">Réinitialiser</button>
        </div>
      </form>

      <div class="info-box">
        <strong>ℹ️ Information:</strong> Veuillez remplir tous les champs pour
        rechercher et réserver votre voyage.
      </div>
    </div>
  </body>
</html>
