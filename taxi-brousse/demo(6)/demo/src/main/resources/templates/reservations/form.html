<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Réservation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        form { margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
        .btn { padding: 10px 20px; text-decoration: none; border-radius: 3px; margin-right: 10px; border: none; cursor: pointer; font-size: 14px; }
        .btn-submit { background-color: #28a745; color: white; }
        .back { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${reservation.idReservation != null} ? 'Éditer Réservation' : 'Créer Réservation'"></h1>
        
        <form th:action="${reservation.idReservation != null} ? @{/reservations/{id}/update(id=${reservation.idReservation})} : @{/reservations/create}" method="POST">
            <div class="form-group">
                <label for="clientId">Client:</label>
                <select id="clientId" name="clientId" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="c : ${clients}" th:value="${c.idClient}" th:selected="${reservation.client?.idClient == c.idClient}" th:text="${c.nom}"></option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="voyageId">Voyage:</label>
                <select id="voyageId" name="voyageId" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="v : ${voyages}" th:value="${v.idVoyage}" th:selected="${reservation.voyage?.idVoyage == v.idVoyage}" th:text="${'Voyage ' + v.idVoyage}"></option>
                </select>
            </div>
            
            <div>
                <button type="submit" class="btn btn-submit">Enregistrer</button>
                <a th:href="@{/reservations}" class="btn back">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
