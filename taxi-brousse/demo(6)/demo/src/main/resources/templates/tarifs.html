<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tarifs par Catégorie</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">
<div class="max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold mb-6 text-blue-400">💰 Grille Tarifaire du Voyage</h1>

  <div class="bg-gray-800 rounded-lg overflow-hidden shadow-xl">
    <table class="w-full text-left border-collapse">
      <thead>
      <tr class="bg-gray-700 text-blue-300">
        <th class="p-4 border-b border-gray-600">Trajet</th>
        <th class="p-4 border-b border-gray-600">Catégorie</th>
        <th class="p-4 border-b border-gray-600 text-right">Prix Unitaire</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="tp : ${listeTrajetPrix}" class="hover:bg-gray-750 border-b border-gray-700">
        <td class="p-4" th:text="${tp.voyage.gareDepart.nom + ' ➔ ' + tp.voyage.gareArrivee.nom}"></td>
        <td class="p-4">
                            <span class="px-2 py-1 bg-blue-900 text-blue-200 rounded text-xs uppercase"
                                  th:text="${tp.categoriePlace.libelle}"></span>
        </td>
        <td class="p-4 text-right font-mono text-green-400 font-bold"
            th:text="${#numbers.formatDecimal(tp.prix, 0, 'WHITESPACE', 0, 'POINT') + ' Ar'}"></td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="mt-6">
    <a href="/achats/nouveau" class="text-blue-400 hover:underline">← Retour à la réservation</a>
  </div>
</div>
</body>
</html>
